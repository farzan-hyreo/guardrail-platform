# SOT: infra, docker-compose, nats-server, local-stack
# Everything the platform needs locally: NATS with JetStream, and Postgres.
#
# NATS is started from a configuration file rather than from flags, because the thing it
# most needs to be told is who is allowed to publish what. `--jetstream` with no accounts
# meant every process on the machine - and everything else that could reach the port - had
# unrestricted access to every subject on the bus. See nats/nats.conf and nats/RUNBOOK.md.
services:
  nats:
    image: nats:2.10-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      # Bound to loopback: nothing outside this machine should be able to open a NATS
      # connection to a development stack, authenticated or not.
      - "127.0.0.1:4222:4222"   # client
      - "127.0.0.1:8222:8222"   # monitoring: http://localhost:8222/varz
    volumes:
      - ./nats:/etc/nats:ro
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guardrail
      POSTGRES_PASSWORD: guardrail
      POSTGRES_DB: guardrail
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardrail"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nats-data:
  pg-data:
