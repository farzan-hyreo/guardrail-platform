# SOT: nats-server-config, jetstream-config, nats-conf
# WHAT   The nats-server configuration the local stack and every deployment start from.
# WHY    The server used to start with `--jetstream` and nothing else: no accounts, no
#        users, no permissions. Anything that could reach :4222 could publish a command,
#        forge an event or race a service's rpc reply, which made the envelope HMAC the
#        only thing standing between a stranger and another tenant's data. Authentication
#        is not defence in depth here - it is the first gate.
# HOW    Everything about who may do what lives in auth.conf, which is generated from the
#        registry. This file holds only the things the registry has no opinion about.
# WHERE  infra/docker-compose.yml mounts this directory at /etc/nats
#        infra/nats/generate-auth.ts writes auth.conf
#        infra/nats/RUNBOOK.md is how you run it

server_name: guardrail

# Monitoring, and the compose healthcheck. Unauthenticated by design - it exposes no
# message data - and bound to loopback by the port mapping in docker-compose.yml.
http_port: 8222

jetstream {
  store_dir: "/data"
  max_memory_store: 1GB
  max_file_store: 10GB
}

# Refuse a connection that has not authenticated within two seconds, so an unauthenticated
# socket cannot sit and wait for something to change.
authorization {
  timeout: 2
}

# Accounts, users and per-user subject permissions. Generated - see the header in the file.
include "auth.conf"
