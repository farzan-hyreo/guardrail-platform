# SOT: nats-accounts, nats-authorisation, bus-permissions
# GENERATED by infra/nats/generate-auth.ts - do not edit. Every subject below is computed
# from packages/registry/src/registry.ts; a permission written here by hand is a permission
# that will disagree with the routes defineService binds at boot.
#
# Regenerate:  pnpm exec tsx infra/nats/generate-auth.ts
# Verify:      pnpm exec tsx infra/nats/generate-auth.ts --check
#
# There is no anonymous user and no no_auth_user: a connection that cannot present one of
# the nkeys below is refused at the server, before the envelope HMAC is ever consulted.

accounts: {
  # One trust domain, many least-privileged identities. Separate accounts per service would
  # need service exports/imports for every rpc subject and a JetStream domain each; the
  # boundary that actually matters here - who may publish a cmd, an evt or an rpc reply -
  # is enforced per user, which is where the registry's ownership already lives.
  APP: {
    jetstream: enabled

    users: [
      # The Next.js gateway. Calls every operation the registry declares and nothing
      # else. It never subscribes to an rpc subject, so it cannot answer for a service.
      {
        nkey: "UC2J3W5NBIGYZFTYFCDWNMQ2Y6NALWM7JGSIJDCYFWZLQTBUUZ2LXP2W"
        permissions: {
          publish: { allow: ["cmd.member.create", "rpc.auditLog.read", "rpc.billing.manage", "rpc.billing.read", "rpc.invitation.delete", "rpc.invitation.read", "rpc.member.delete", "rpc.member.read", "rpc.project.create", "rpc.project.delete", "rpc.project.read", "rpc.project.update"] }
          subscribe: { allow: ["_INBOX.gateway.>"] }
        }
      }

      # Owns project. Answers 4 rpc subject(s). Emits 3 evt subject(s).
      {
        nkey: "UA6PHME65XNEPA7SDQSOVXH7ZAK4AVNWPWHEAQDMUMVVPU6AGPFGLS6F"
        permissions: {
          publish: { allow: ["evt.project.create", "evt.project.delete", "evt.project.update"] }
          subscribe: { allow: ["_INBOX.projects.>", "rpc.project.create", "rpc.project.delete", "rpc.project.read", "rpc.project.update"] }
          allow_responses: { max: 1, expires: "30s" }
        }
      }

      # Owns member, invitation. Answers 4 rpc subject(s). Emits 3 evt subject(s).
      # Consumes the CMD stream.
      {
        nkey: "UBYGVXLGX4PWPT53O2BC4VYA2SW6L4JKYM3DU34NR4NJWPXS5MW67USW"
        permissions: {
          publish: { allow: ["$JS.ACK.>", "$JS.API.CONSUMER.CREATE.CMD", "$JS.API.CONSUMER.CREATE.CMD.>", "$JS.API.CONSUMER.DURABLE.CREATE.CMD.*", "$JS.API.CONSUMER.INFO.CMD.*", "$JS.API.CONSUMER.MSG.NEXT.CMD.*", "$JS.API.INFO", "$JS.API.STREAM.INFO.CMD", "evt.invitation.delete", "evt.member.create", "evt.member.delete"] }
          subscribe: { allow: ["_INBOX.identity.>", "rpc.invitation.delete", "rpc.invitation.read", "rpc.member.delete", "rpc.member.read"] }
          allow_responses: { max: 1, expires: "30s" }
        }
      }

      # Owns billing. Answers 2 rpc subject(s). Emits 1 evt subject(s). Consumes the EVT
      # stream.
      {
        nkey: "UC6XZMD56X6AD5P6QFCW3SZFUMZTVTTFFCYYMRPXFZB6TLOK7BVZOM3P"
        permissions: {
          publish: { allow: ["$JS.ACK.>", "$JS.API.CONSUMER.CREATE.EVT", "$JS.API.CONSUMER.CREATE.EVT.>", "$JS.API.CONSUMER.DURABLE.CREATE.EVT.*", "$JS.API.CONSUMER.INFO.EVT.*", "$JS.API.CONSUMER.MSG.NEXT.EVT.*", "$JS.API.INFO", "$JS.API.STREAM.INFO.EVT", "evt.billing.manage"] }
          subscribe: { allow: ["_INBOX.billing.>", "rpc.billing.manage", "rpc.billing.read"] }
          allow_responses: { max: 1, expires: "30s" }
        }
      }

      # Owns auditLog. Answers 1 rpc subject(s). Consumes the EVT stream.
      {
        nkey: "UC6K24NNC4UPMULCRQKNKSEOOP3STKTN5MA5OS4L35SFBHECT4U7T3SF"
        permissions: {
          publish: { allow: ["$JS.ACK.>", "$JS.API.CONSUMER.CREATE.EVT", "$JS.API.CONSUMER.CREATE.EVT.>", "$JS.API.CONSUMER.DURABLE.CREATE.EVT.*", "$JS.API.CONSUMER.INFO.EVT.*", "$JS.API.CONSUMER.MSG.NEXT.EVT.*", "$JS.API.INFO", "$JS.API.STREAM.INFO.EVT"] }
          subscribe: { allow: ["_INBOX.audit.>", "rpc.auditLog.read"] }
          allow_responses: { max: 1, expires: "30s" }
        }
      }

      # `pnpm nats:bootstrap`. Creates and updates the streams the registry declares. It
      # cannot publish a message onto any of them.
      {
        nkey: "UAJC45OJ5VXIU2ORQXT7CULPN3WY7Q5PH54X3FAWXEHAATNVV2L7F6Y6"
        permissions: {
          publish: { allow: ["$JS.API.INFO", "$JS.API.STREAM.CREATE.CMD", "$JS.API.STREAM.CREATE.EVT", "$JS.API.STREAM.INFO.CMD", "$JS.API.STREAM.INFO.EVT", "$JS.API.STREAM.UPDATE.CMD", "$JS.API.STREAM.UPDATE.EVT"] }
          subscribe: { allow: ["_INBOX.bootstrap.>"] }
        }
      }

      # `make logs`. Read-only tap on the event stream for debugging. Events carry
      # orgId, userId and role, so this is a development credential - a deployment
      # should not issue one.
      {
        nkey: "UD4YN53X4SP45HZS4CSYH7IZDKMJGGEBU27LNSOHKO3OIAMVEVSS7MXZ"
        permissions: {
          publish: { deny: [">"] }
          subscribe: { allow: ["evt.>", "_INBOX.observer.>"] }
        }
      }
    ]
  }

  SYS: {
    users: [
      # `nats server report` and friends. In the system account, so it can read $SYS.>
      # and touch nothing in APP.
      {
        nkey: "UCWCY3OFVP5V7ILP7KXTZCUTVNS24I4XD2KERY24A7LPKLLZUEJT7Q3C"
      }
    ]
  }
}

system_account: SYS
